<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Demo Works. Your Callers Don't.</title>
<style>
  /* First cut of the four-zone layout from docs/SPEC.md. Everything inline on purpose: the
     room's network is not ours, so the page loads with zero external requests.
     Zones: 1 transcript (dominant), 2 state pill, 3 confidence bar, 4 stats strip. */
  :root {
    --bg: #0b0d10; --fg: #f4f6f8; --dim: #8b949e; --line: #1f242b;
    --listening: #3fb950; --thinking: #f0b429; --speaking: #58a6ff; --interrupted: #f85149; --idle: #6e7681;
    --caller: #f4f6f8; --agent: #79c0ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 500 24px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-rows: auto auto 1fr auto auto; gap: 18px;
    padding: 24px 40px 20px; overflow: hidden;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.01em; color: var(--dim); font-weight: 600; }
  .right { display: flex; align-items: center; gap: 18px; }
  #lang { font: 700 20px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim); text-transform: uppercase; }
  #state {
    font: 800 30px/1 system-ui, sans-serif; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 12px 28px; border-radius: 999px; color: #000; background: var(--idle); min-width: 240px; text-align: center;
  }
  #state[data-state="listening"] { background: var(--listening); }
  #state[data-state="thinking"] { background: var(--thinking); }
  #state[data-state="speaking"] { background: var(--speaking); }
  #state[data-state="interrupted"] { background: var(--interrupted); }
  #conn { font-size: 16px; color: var(--dim); }
  #conn[data-state="disconnected"] { color: var(--interrupted); font-weight: 700; }

  /* Toggles: visible, not prominent. The presenter hits them without looking; 1-4 on the keyboard. */
  #toggles { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; font-size: 15px; }
  .tg { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px; border: 2px solid var(--line); background: transparent; color: var(--fg); font: 700 15px/1 system-ui, sans-serif; cursor: pointer; letter-spacing: 0.02em; }
  .tg kbd { font: 700 11px/1 ui-monospace, Menlo, monospace; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; }
  .tg[aria-pressed="true"] { border-color: var(--speaking); background: rgba(88, 166, 255, 0.15); }
  .tg.danger[aria-pressed="true"] { border-color: var(--interrupted); background: rgba(248, 81, 73, 0.2); color: #ffd6d3; }
  .sl { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); font: 700 13px/1 system-ui, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; }
  .sl input { width: 130px; accent-color: var(--speaking); }
  .sl output { font: 700 15px/1 ui-monospace, Menlo, monospace; color: var(--fg); min-width: 5ch; text-align: right; font-variant-numeric: tabular-nums; }
  #rejected { color: var(--interrupted); font-weight: 700; font-size: 14px; }
  #applied { color: var(--listening); font-weight: 700; font-size: 14px; }
  main { display: grid; grid-template-rows: 1fr 1fr; gap: 20px; min-height: 0; }
  .turn { display: grid; grid-template-rows: auto 1fr; gap: 8px; min-height: 0; border-top: 2px solid var(--line); padding-top: 12px; }
  .who { font: 700 16px/1 system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  .text { font-size: clamp(34px, 4.2vw, 64px); line-height: 1.15; font-weight: 700; overflow: hidden; text-wrap: balance; }
  #caller { color: var(--caller); }
  #caller.interim { color: var(--dim); font-weight: 500; }
  #agent { color: var(--agent); }
  #agent .cut { color: var(--interrupted); font-weight: 500; font-size: 0.6em; margin-left: 0.4em; vertical-align: middle; }
  .empty { color: var(--dim); font-weight: 500; }

  .bar-wrap { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; }
  .bar-label { font: 700 16px/1 system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
  #bar { height: 28px; border-radius: 999px; background: var(--line); overflow: hidden; position: relative; }
  #bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #1b998b, #3fb950); transition: width 120ms linear; }
  #bar b { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--thinking); left: 70%; }
  #conf { font: 700 24px/1 ui-monospace, SFMono-Regular, Menlo, monospace; min-width: 4ch; text-align: right; font-variant-numeric: tabular-nums; }

  footer { display: flex; flex-wrap: wrap; gap: 28px 40px; align-items: baseline; font-variant-numeric: tabular-nums; }
  .stat { display: grid; gap: 2px; }
  .stat .k { font: 700 13px/1 system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  .stat .v { font: 700 26px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .stat .v small { font-size: 14px; color: var(--dim); font-weight: 500; }
  #degraded { display: none; background: var(--interrupted); color: #000; font-weight: 800; padding: 10px 16px; border-radius: 10px; }
  #degraded.on { display: block; }
  details { margin-left: auto; font-size: 14px; color: var(--dim); }
  details pre { max-height: 160px; overflow: auto; margin: 6px 0 0; font-size: 12px; line-height: 1.3; color: var(--dim); }
</style>
</head>
<body>
  <header>
    <h1>Your Demo Works. Your Callers Don't.</h1>
    <div class="right">
      <span id="conn" data-state="connecting">connecting</span>
      <span id="lang"></span>
      <span id="state" data-state="idle">waiting</span>
    </div>
  </header>

  <div id="toggles">
    <button class="tg danger" data-toggle="naiveMode" aria-pressed="false"><kbd>1</kbd> naive mode</button>
    <button class="tg" data-toggle="keyterms" aria-pressed="false"><kbd>2</kbd> keyterms</button>
    <button class="tg" data-toggle="eagerEot" aria-pressed="false"><kbd>3</kbd> eager EOT</button>
    <button class="tg" data-toggle="multilingual" aria-pressed="false"><kbd>4</kbd> multilingual</button>
    <label class="sl">eager <input type="range" data-toggle="eagerEotThreshold" min="0.3" max="0.9" step="0.05"><output>0.50</output></label>
    <label class="sl">eot <input type="range" data-toggle="eotThreshold" min="0.5" max="0.9" step="0.05"><output>0.70</output></label>
    <label class="sl">timeout <input type="range" data-toggle="eotTimeoutMs" min="500" max="10000" step="100"><output>5000</output></label>
    <span id="applied"></span>
    <span id="rejected"></span>
  </div>

  <main>
    <section class="turn">
      <div class="who">Caller</div>
      <div id="caller" class="text empty">Waiting for a call</div>
    </section>
    <section class="turn">
      <div class="who">Agent</div>
      <div id="agent" class="text empty"></div>
    </section>
  </main>

  <div class="bar-wrap">
    <span class="bar-label">End of turn confidence</span>
    <div id="bar"><i></i><b title="eot_threshold"></b></div>
    <span id="conf">0.00</span>
  </div>

  <footer>
    <div class="stat"><span class="k">End of turn</span><span class="v" id="eot">–<small> ms</small></span></div>
    <div class="stat"><span class="k">EOT p50 / p90 / p95</span><span class="v" id="eotp">–</span></div>
    <div class="stat"><span class="k">LLM first token</span><span class="v" id="ttft">–<small> ms</small></span></div>
    <div class="stat"><span class="k">TTS first byte</span><span class="v" id="ttfb">–<small> ms</small></span></div>
    <div class="stat"><span class="k">Speculative issued / used</span><span class="v" id="spec">0 / 0</span></div>
    <div class="stat"><span class="k">Socket uptime</span><span class="v" id="uptime">–</span></div>
    <div class="stat"><span class="k">Reconnects</span><span class="v" id="reconnects">0</span></div>
    <span id="degraded"></span>
    <details><summary>event log</summary><pre id="events"></pre></details>
  </footer>

<script>
  const $ = (id) => document.getElementById(id)
  const el = { conn: $('conn'), lang: $('lang'), state: $('state'), caller: $('caller'), agent: $('agent'),
    bar: $('bar').querySelector('i'), conf: $('conf'), eot: $('eot'), eotp: $('eotp'), ttft: $('ttft'), ttfb: $('ttfb'),
    uptime: $('uptime'), reconnects: $('reconnects'), degraded: $('degraded'), events: $('events'),
    applied: $('applied'), rejected: $('rejected'), spec: $('spec') }

  let ws = null
  let toggles = null
  const specTurns = new Set()
  let specUsed = 0
  const tgButtons = [...document.querySelectorAll('button.tg')]
  const tgSliders = [...document.querySelectorAll('input[type=range][data-toggle]')]

  function sendToggle(name, value) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'toggle', name, value })) }

  function renderToggles() {
    if (!toggles) return
    for (const b of tgButtons) b.setAttribute('aria-pressed', String(!!toggles[b.dataset.toggle]))
    for (const sl of tgSliders) {
      const name = sl.dataset.toggle
      // The UI enforces the one rule Flux enforces with a disconnect: eager can never exceed eot.
      if (name === 'eagerEotThreshold') sl.max = String(toggles.eotThreshold)
      sl.value = String(toggles[name])
      sl.nextElementSibling.textContent = name === 'eotTimeoutMs' ? String(toggles[name]) : Number(toggles[name]).toFixed(2)
    }
  }

  for (const b of tgButtons) b.addEventListener('click', () => toggles && sendToggle(b.dataset.toggle, !toggles[b.dataset.toggle]))
  for (const sl of tgSliders) {
    sl.addEventListener('input', () => { sl.nextElementSibling.textContent = sl.dataset.toggle === 'eotTimeoutMs' ? sl.value : Number(sl.value).toFixed(2) })
    sl.addEventListener('change', () => {
      const name = sl.dataset.toggle, value = Number(sl.value)
      if (name === 'eotThreshold' && toggles && toggles.eagerEotThreshold > value) sendToggle('eagerEotThreshold', value)
      sendToggle(name, value)
    })
  }
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return
    const i = ['1', '2', '3', '4'].indexOf(e.key)
    if (i >= 0) tgButtons[i].click()
  })

  let callStartedAt = null      // bus time of call.started, for socket uptime
  let lastEventT = 0
  let reconnects = 0
  const eotSamples = []
  const logLines = []

  function ms(node, value) { node.innerHTML = Math.round(value) + '<small> ms</small>' }
  function pct(arr, p) { const s = [...arr].sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(p * s.length))] }

  function setCaller(text, interim) {
    el.caller.textContent = text || (interim ? '…' : '')
    el.caller.classList.toggle('interim', !!interim)
    el.caller.classList.remove('empty')
  }

  function apply(e) {
    lastEventT = e.t
    switch (e.kind) {
      case 'call.started': callStartedAt = e.t; el.caller.textContent = 'Listening…'; el.caller.classList.add('empty'); el.agent.textContent = ''; break
      case 'call.ended': callStartedAt = null; el.state.dataset.state = 'idle'; el.state.textContent = 'call ended'; break
      case 'agent.state': el.state.dataset.state = e.state; el.state.textContent = e.state; break
      case 'stt.update':
        el.bar.style.width = Math.round(e.eotConfidence * 100) + '%'
        el.conf.textContent = e.eotConfidence.toFixed(2)
        if (e.text) setCaller(e.text, true)
        break
      case 'stt.startOfTurn': el.caller.classList.remove('empty'); break
      case 'stt.endOfTurn':
        setCaller(e.text, false)
        ms(el.eot, e.latencyMs)
        eotSamples.push(e.latencyMs)
        el.eotp.textContent = `${pct(eotSamples, 0.5)} / ${pct(eotSamples, 0.9)} / ${pct(eotSamples, 0.95)}`
        break
      case 'stt.languages': el.lang.textContent = e.languages.join(' '); break
      case 'agent.reply': el.agent.textContent = e.text; el.agent.classList.remove('empty'); break
      case 'tts.interrupt':
        el.agent.innerHTML = ''
        el.agent.append(document.createTextNode(e.textSpoken || '(cut before a word was heard)'))
        const cut = document.createElement('span'); cut.className = 'cut'; cut.textContent = '⟵ heard up to here'
        el.agent.append(cut)
        break
      case 'tts.firstByte': ms(el.ttfb, e.ttfbMs); break
      case 'socket.degraded': el.degraded.textContent = `${e.which} degraded: ${e.detail}`.slice(0, 120); el.degraded.classList.add('on'); break
      case 'socket.recovered': reconnects += e.attempts ? 1 : 0; el.reconnects.textContent = reconnects; el.degraded.classList.remove('on'); break
      case 'config.applied':
        el.degraded.classList.remove('on')
        el.applied.textContent = (e.reconnected ? 'RECONNECTED: ' : 'applied live, no reconnect: ') + e.fields.join(', ')
        el.applied.style.color = e.reconnected ? 'var(--interrupted)' : 'var(--listening)'
        clearTimeout(el.applied._t); el.applied._t = setTimeout(() => { el.applied.textContent = '' }, 6000)
        break
      case 'toggle.changed': if (toggles) { toggles[e.name] = e.value; renderToggles() } break
      case 'llm.speculativeStart': specTurns.add(e.turnId); el.spec.textContent = `${specTurns.size} / ${specUsed}`; break
      case 'llm.firstToken': if (specTurns.has(e.turnId)) { specUsed += 1; el.spec.textContent = `${specTurns.size} / ${specUsed}` } ms(el.ttft, e.ttftMs); break
    }
    logLines.push(JSON.stringify(e)); if (logLines.length > 200) logLines.shift()
    el.events.textContent = logLines.slice(-40).join('\n')
  }

  // Uptime ticks off the bus clock offset so it keeps counting between events.
  let clockOffset = null // browser now - bus t
  setInterval(() => {
    if (callStartedAt === null || clockOffset === null) { el.uptime.textContent = '–'; return }
    const busNow = performance.now() - clockOffset
    const s = Math.max(0, Math.floor((busNow - callStartedAt) / 1000))
    el.uptime.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`
  }, 250)

  let backoff = 500
  function connect() {
    el.conn.dataset.state = 'connecting'; el.conn.textContent = 'connecting'
    ws = new WebSocket((location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws/dashboard')
    ws.addEventListener('open', () => { el.conn.dataset.state = 'connected'; el.conn.textContent = 'live'; backoff = 500 })
    ws.addEventListener('message', (msg) => {
      let frame; try { frame = JSON.parse(msg.data) } catch { return }
      if (frame.type === 'replay') {
        specTurns.clear(); specUsed = 0
        if (frame.snapshot && frame.snapshot.toggles) { toggles = { ...frame.snapshot.toggles }; renderToggles() }
        for (const ev of frame.events) apply(ev)
        if (frame.snapshot && frame.snapshot.toggles) { toggles = { ...frame.snapshot.toggles }; renderToggles() }
      }
      else if (frame.type === 'event') apply(frame.event)
      else if (frame.type === 'toggles') { toggles = { ...frame.toggles }; renderToggles(); el.rejected.textContent = '' }
      else if (frame.type === 'toggle.rejected') { el.rejected.textContent = `${frame.name}: ${frame.reason}`; renderToggles() }
      if (lastEventT) clockOffset = performance.now() - lastEventT
    })
    ws.addEventListener('close', () => {
      el.conn.dataset.state = 'disconnected'; el.conn.textContent = 'dashboard socket down'
      setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 8000)
    })
    ws.addEventListener('error', () => ws.close())
  }
  connect()
</script>
</body>
</html>
